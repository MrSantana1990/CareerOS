name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev]"
      - run: pytest apps/api/tests -q
      - run: python -m compileall -q apps/api/src apps/api/migrations

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        env:
          POSTGRES_PASSWORD: validation-postgres
          REDIS_PASSWORD: validation-redis
          ADMIN_API_TOKEN: validation-token-with-at-least-32-characters
        run: docker compose -f deploy/vps/docker-compose.yml config --quiet
      - name: Construir API
        run: docker build -t helpsystem-carreira-api:ci apps/api
      - name: Construir painel
        run: >
          docker build
          --build-arg FOUNDATION_API_URL=http://api:8000
          --build-arg AUTOMATION_HOST_URL=http://127.0.0.1:8765
          -f apps/web/Dockerfile
          -t helpsystem-carreira-web:ci .
