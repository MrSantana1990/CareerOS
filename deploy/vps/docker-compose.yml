name: helpsystem-carreira

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: carreira
      POSTGRES_USER: carreira
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carreira -d carreira"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  api:
    build:
      context: ../../apps/api
    environment:
      APP_NAME: HelpSystem Carreira
      APP_ENV: production
      DATABASE_URL: "postgresql+asyncpg://carreira:${POSTGRES_PASSWORD}@postgres:5432/carreira"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?Defina ADMIN_API_TOKEN}"
      CORS_ORIGINS: "https://carreira.helpsystempro.site"
      GLOBAL_AUTOMATION_ENABLED: "false"
      AUTO_APPLY_ENABLED: "false"
      AUTO_APPLY_SAFETY_ACKNOWLEDGED: "false"
      AUTO_DISCOVERY_ENABLED: "false"
      AUTO_SCORE_ENABLED: "false"
      AUTO_EMAIL_APPLY_ENABLED: "false"
      AUTO_BROWSER_APPLY_ENABLED: "false"
      AUTO_FOLLOWUP_ENABLED: "false"
      AUTO_CALENDAR_ENABLED: "false"
      PUSH_NOTIFICATIONS_ENABLED: "false"
      RESUME_STORAGE_DIR: "/data/resumes"
    volumes:
      - resume_data:/data/resumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  worker:
    build:
      context: ../../apps/worker
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      AUTO_APPLY_ENABLED: "false"
      AUTO_SCORE_ENABLED: "false"
      AUTO_DISCOVERY_ENABLED: "false"
      CAREER_API_URL: http://api:8000
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?Defina ADMIN_API_TOKEN}"
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private, edge]

  scheduler:
    build:
      context: ../../apps/worker
    command: ["python", "-m", "src.scheduler"]
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      AUTO_DISCOVERY_ENABLED: "false"
      DISCOVERY_TICK_SECONDS: "1800"
      CAREER_API_URL: http://api:8000
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?Defina ADMIN_API_TOKEN}"
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private, edge]

  integrations:
    build:
      context: ../../apps/automation-host
    environment:
      CAREER_RUNTIME: /data/runtime
      LOCAL_AI_URL: http://127.0.0.1:8080/v1
      RESUME_STORAGE_DIR: /data/resumes
      CAREER_API_URL: http://api:8000
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?Defina ADMIN_API_TOKEN}"
      EXECUTOR_ID: "vps-integrations"
      BROWSER_HEADLESS: "false"
      BROWSER_CHANNEL: "chrome"
      BROWSER_REMOTE_DEBUG_PORT: "${BROWSER_REMOTE_DEBUG_PORT:-}"
      AUTO_APPLY_ENABLED: "false"
      DRY_RUN_ENABLED: "false"
    ports:
      # Loopback-only, so acessivel via tunel SSH deliberado - CDP so
      # escuta de verdade quando BROWSER_REMOTE_DEBUG_PORT esta setado.
      - "127.0.0.1:9222:9222"
    volumes:
      - integrations_data:/data/runtime
      - resume_data:/data/resumes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private, edge]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        FOUNDATION_API_URL: http://api:8000
        AUTOMATION_HOST_URL: http://integrations:8765
    environment:
      FOUNDATION_API_URL: http://api:8000
      FOUNDATION_ADMIN_TOKEN: "${ADMIN_API_TOKEN:?Defina ADMIN_API_TOKEN}"
      AUTOMATION_HOST_URL: http://integrations:8765
      PORTAL_LOGIN_EMAIL: "${PORTAL_LOGIN_EMAIL:?Defina PORTAL_LOGIN_EMAIL}"
      PORTAL_PASSWORD_HASH: "${PORTAL_PASSWORD_HASH:?Defina PORTAL_PASSWORD_HASH}"
      PORTAL_SESSION_SECRET: "${PORTAL_SESSION_SECRET:?Defina PORTAL_SESSION_SECRET}"
    ports:
      - "127.0.0.1:${CAREER_PORT:-8093}:3000"
    depends_on:
      api: { condition: service_healthy }
      integrations: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health/web"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [private, edge]

networks:
  private:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  resume_data:
  integrations_data:
